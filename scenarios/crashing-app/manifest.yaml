# crashing-app exits because APP_MODE=bogus. healthy-app stays healthy.
# Namespace crashing-app comes from rbac.yaml, with the agent's access.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashing-app
  namespace: crashing-app
  labels:
    app: crashing-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashing-app
  template:
    metadata:
      labels:
        app: crashing-app
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: crashing-app
          image: busybox:1.36
          command: ["sh", "-c", "echo unknown APP_MODE $APP_MODE, expected normal or debug; exit 1"]
          env:
            - name: APP_MODE
              value: bogus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthy-app
  namespace: crashing-app
  labels:
    app: healthy-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healthy-app
  template:
    metadata:
      labels:
        app: healthy-app
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: healthy-app
          image: busybox:1.36
          command: ["sleep", "3600"]
