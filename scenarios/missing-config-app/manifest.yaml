# missing-config-app loads ConfigMap app-settings, and that ConfigMap does not exist.
# healthy-app loads its own ConfigMap and stays healthy.
# Namespace missing-config-app comes from rbac.yaml, with the agent's access.
apiVersion: v1
kind: ConfigMap
metadata:
  name: healthy-app-settings
  namespace: missing-config-app
data:
  MODE: normal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-config-app
  namespace: missing-config-app
  labels:
    app: missing-config-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: missing-config-app
  template:
    metadata:
      labels:
        app: missing-config-app
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: missing-config-app
          image: busybox:1.36
          command: ["sleep", "3600"]
          envFrom:
            - configMapRef:
                name: app-settings
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthy-app
  namespace: missing-config-app
  labels:
    app: healthy-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healthy-app
  template:
    metadata:
      labels:
        app: healthy-app
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: healthy-app
          image: busybox:1.36
          command: ["sleep", "3600"]
          envFrom:
            - configMapRef:
                name: healthy-app-settings
