# not-ready-app listens on 8080. The health check asks port 8081. healthy-app stays healthy.
# Namespace not-ready-app comes from rbac.yaml, with the agent's access.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: not-ready-app
  namespace: not-ready-app
  labels:
    app: not-ready-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: not-ready-app
  template:
    metadata:
      labels:
        app: not-ready-app
    spec:
      containers:
        - name: not-ready-app
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8081
            periodSeconds: 2
            failureThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: not-ready-app
  namespace: not-ready-app
spec:
  selector:
    app: not-ready-app
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthy-app
  namespace: not-ready-app
  labels:
    app: healthy-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healthy-app
  template:
    metadata:
      labels:
        app: healthy-app
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: healthy-app
          image: busybox:1.36
          command: ["sleep", "3600"]
