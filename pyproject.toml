[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-troubleshooter"
version = "0.1.0"
description = "A small agent that investigates a local kind cluster."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.2.19",
  "langchain-core>=1.7.4",
  "langchain-openai>=1.7.3",
  "opentelemetry-api>=1.45.2",
  "opentelemetry-sdk>=1.45.2",
  "pydantic>=2.14.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0"]

[project.scripts]
k8s-troubleshooter = "k8s_troubleshooter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "cluster: runs against the local kind cluster",
]
