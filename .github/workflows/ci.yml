name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs, so a moved tag cannot change what runs. The comment is the tag.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: k8s-troubleshooter
          config: kind.yaml

      - name: Admin login and the agent's limited login
        run: sh scripts/setup-access.sh

      - name: Test
        env:
          CI: "true"
        run: |
          python -m pip install -c constraints.txt -e ".[dev]"
          pytest

      - name: Build the image
        run: docker build -t k8s-troubleshooter:local .

      - name: The image starts
        run: |
          docker run --rm -e AGENT_MODEL=rules k8s-troubleshooter:local investigate "Why is crashing-app unhealthy?" | tee /tmp/k8s-troubleshooter-out.json
          grep -q "Could not read" /tmp/k8s-troubleshooter-out.json
